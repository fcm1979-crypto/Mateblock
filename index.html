<head>
<meta charset="UTF-8"/>

<style>
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{height:100%;overflow:hidden;}
body{font-family:'Nunito',sans-serif;background:#12082a;height:100vh;overflow:hidden;}
#home{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:radial-gradient(ellipse at 15% 0%,#3d1a6e,transparent 50%),
  radial-gradient(ellipse at 85% 15%,#1a3a6e,transparent 45%),
  radial-gradient(ellipse at 50% 100%,#6e1a1a,transparent 45%),
  linear-gradient(160deg,#0e061c,#0d1b3e 55%,#180a18);
  transition:transform .4s cubic-bezier(.4,0,.2,1),opacity .3s;z-index:10;}
#home.out{transform:translateX(-100%);opacity:0;pointer-events:none;}
.hi{padding:calc(var(--st)+16px) 14px calc(28px + var(--sb));max-width:500px;margin:0 auto;}
.lw{text-align:center;margin-bottom:6px;}
.tag{display:inline-block;background:#cc0000;padding:3px 16px 4px;font-size:11px;font-weight:900;letter-spacing:.4em;text-transform:uppercase;color:white;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);margin-bottom:5px;}
.lt{font-family:'Fredoka One',cursive;font-size:56px;line-height:1;letter-spacing:-2px;display:block;color:#ffe566;-webkit-text-stroke:2px rgba(100,60,0,.8);text-shadow:3px 3px 0 rgba(100,50,0,.9);}
.lt .r{color:#ff5522;-webkit-text-stroke:2px rgba(80,0,0,.8);text-shadow:3px 3px 0 rgba(90,0,0,.9);}
.ls{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:rgba(180,150,255,.65);margin-top:4px;}
.mw{text-align:center;margin:8px 0 16px;}
.mb{display:inline-block;animation:mb 2.8s ease-in-out infinite;}
@keyframes mb{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-10px) rotate(2deg);}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mc{border:0;cursor:pointer;border-radius:20px;padding:0;overflow:hidden;display:flex;flex-direction:column;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);transition:transform .15s;box-shadow:0 5px 20px rgba(0,0,0,.4);}
.mc:active{transform:scale(.91);}
.cs{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,var(--cc),transparent 55%);opacity:.22;}
.mc{position:relative;}
.ct{padding:18px 12px 14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--cc),rgba(0,0,0,.55));min-height:90px;position:relative;overflow:hidden;}
.ct::before{content:"";position:absolute;top:0;left:0;right:0;height:40%;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent);}
.cb{padding:8px 10px 12px;}
.cn{font-family:'Fredoka One',cursive;font-size:13px;color:#fff;line-height:1.2;margin-bottom:4px;}
.cl{font-size:9px;font-weight:800;color:var(--cc);background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);border-radius:99px;padding:2px 8px;display:inline-block;}
@keyframes pop{from{transform:scale(.7) translateY(30px);opacity:0;}to{transform:scale(1);opacity:1;}}
.mc{animation:pop .5s cubic-bezier(.2,1.5,.5,1) both;}
.mc:nth-child(1){animation-delay:.04s}.mc:nth-child(2){animation-delay:.08s}.mc:nth-child(3){animation-delay:.12s}.mc:nth-child(4){animation-delay:.16s}.mc:nth-child(5){animation-delay:.20s}.mc:nth-child(6){animation-delay:.24s}.mc:nth-child(7){animation-delay:.28s}.mc:nth-child(8){animation-delay:.32s}.mc:nth-child(9){animation-delay:.36s}.mc:nth-child(10){animation-delay:.40s}

/* PANTALLA MÓDULO */
#ms{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
  transform:translateX(100%);opacity:0;
  transition:transform .4s cubic-bezier(.4,0,.2,1),opacity .3s;}
#ms.in{transform:translateX(0);opacity:1;}
.mh{flex-shrink:0;padding:calc(var(--st)+10px) 12px 10px;display:flex;align-items:center;gap:10px;background:rgba(6,3,14,.97);border-bottom:3px solid var(--mc,#ff6b35);}
.hb{width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.1);color:#fff;font-size:22px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.hb:active{background:rgba(255,255,255,.25);}
.htx{flex:1;}
.ht{font-family:'Fredoka One',cursive;font-size:19px;color:#fff;}
.hlv{font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--mc,#ff6b35);margin-top:2px;}
#ifw{flex:1;overflow:hidden;position:relative;background:#2a1808;}
#mif{width:100%;height:100%;border:0;display:block;}
</style>
</head>

<script>
function openMod(file, name, color, level) {
  document.getElementById('ht').textContent = name;
  document.getElementById('hlv').textContent = level;
  var mh = document.getElementById('mh');
  mh.style.setProperty('--mc', color);
  mh.style.borderBottomColor = color;
  // Cargar el archivo del módulo directamente en el iframe
  document.getElementById('mif').src = file;
  document.getElementById('home').classList.add('out');
  document.getElementById('ms').classList.add('in');
}

document.getElementById('hb').addEventListener('click', function() {
  document.getElementById('home').classList.remove('out');
  document.getElementById('ms').classList.remove('in');
  document.getElementById('mif').src = 'about:blank';
});
</script>
